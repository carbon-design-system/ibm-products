name: 'Issue Labeler'
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  label-issues:
    # do not run on forks
    if: github.repository == 'carbon-design-system/ibm-products'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Label Issue
        uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: .github/labeler.yml
          not-before: 2025-10-22T00:00:00Z
          enable-versioned-regex: 0
          include-title: 1
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
