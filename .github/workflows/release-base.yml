# This is the base release workflow dispatched by the `release-minor` or `release-patch` workflows
name: Release base
run-name: ${{ inputs.type }} - dry-run:${{ inputs.dry-run }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      semver-type:
        type: string
        default: minor
        required: true
      type:
        type: string
        default: first rc
        required: true
      dry-run:
        type: boolean
        default: true
        required: true
        description: 'Run dry run?'

# Required for OIDC publishing https://docs.npmjs.com/trusted-publishers
permissions:
  id-token: write
  contents: write

jobs:
  # Run all CI checks (build, test, lint, etc.) by calling the optimized CI workflow
  ci-checks:
    uses: ./.github/workflows/ci.yml
    with:
      skip-for-release: true # Skip Chromatic visual tests during releases

  # Run AVT tests sharded (matching ci.yml) so that the Playwright JSON reporter writes
  # packages/ibm-products/.playwright/INTERNAL_AVT_REPORT_DO_NOT_USE.json to disk.
  # That file is listed in packages/ibm-products/package.json `files` and must exist
  # before `lerna publish` runs, otherwise npm silently omits it from the tarball.
  avt-runner:
    needs: ci-checks
    strategy:
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            */**/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies (fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Build packages
        run: yarn build:packages

      - name: Install browsers
        run: yarn playwright install --with-deps

      - name: Run storybook
        id: storybook
        run: |
          npx serve -l 3000 packages/ibm-products/storybook-static &
          pid=$!
          echo "pid=$pid" >> $GITHUB_OUTPUT

      - uses: ./actions/wait-for-it
        with:
          URL: 'http://localhost:3000'
        timeout-minutes: 3

      - name: Run AVT
        if: github.repository == 'carbon-design-system/ibm-products'
        run: |
          yarn playwright test --project chromium --grep @avt --shard="${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"

      - name: Stop storybook
        run: kill ${{ steps.storybook.outputs.pid }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  # Merge the sharded blob reports and produce the JSON report on disk, then publish.
  release:
    needs: avt-runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.MERGE_ACTION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          token: ${{ secrets.GITHUB_TOKEN }} # https://github.com/lerna/lerna/issues/1957

      # https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
      - run: |
          git config --global user.email ${{ secrets.CARBON_BOT_EMAIL }}
          git config --global user.name ${{ secrets.CARBON_BOT_NAME }}

      - name: Use Node.js version from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            */**/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies (fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Build packages
        run: yarn build:packages

      # Merge the blob reports from the sharded avt-runner jobs and write the JSON
      # report directly to the path declared in playwright.config.js. Because this
      # runs in the same workflow (same run_id), download-artifact finds the blobs
      # without needing a cross-workflow token or run-id lookup.
      - name: Download blob reports
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: all-blob-reports
          pattern: release-blob-report-*
          merge-multiple: true

      - name: Generate AVT JSON report
        run: |
          mkdir -p packages/ibm-products/.playwright
          npx playwright merge-reports --reporter json ./all-blob-reports > packages/ibm-products/.playwright/INTERNAL_AVT_REPORT_DO_NOT_USE.json

      - name:
          Run @ibm/telemetry-js-config-generator to regenerate ibm-products
          telemetry config file
        if: github.event.inputs.dry-run == 'true'
        run: |
          yarn release-telemetry
          if [ -z "$(git status --porcelain)" ]; then
            echo "Mirror is clean, exiting..."
          else
            git add '**/telemetry.yml'
            git commit -m "chore(telemetry): update telemetry configs"
            git push origin
          fi

      - name: Set NPM token
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.CARBON_BOT_NPM_TOKEN }}" >> .npmrc

      # Set the PUBLISH environment variable to be used later in the Lerna publish command.
      # Lerna has dry run on by default, need to pass in '--yes' flag before it will go ahead and publish.
      - name: Set dry run env variable
        run: |
          if [ "${{ github.event.inputs.dry-run }}" == "false"  ]; then
            echo "PUBLISH=--yes" >> $GITHUB_ENV
          fi

      - name: Publish full minor release (ie. v1.x.0)
        if: |
          github.event.inputs.type == 'full release' &&
          github.event.inputs.semver-type == 'minor'
        run: |
          yarn lerna publish minor --conventional-graduate $(echo "${{ env.PUBLISH }}")

      - name: Publish first minor RC (ie. v1.x.0-rc.0)
        if: |
          github.event.inputs.type == 'first rc' &&
          github.event.inputs.semver-type == 'minor'
        run: |
          yarn lerna publish preminor --conventional-prerelease --preid rc --pre-dist-tag next $(echo "${{ env.PUBLISH }}")

      - name: Publish full patch release (ie. v1.0.x)
        if: |
          github.event.inputs.type == 'full release' &&
          github.event.inputs.semver-type == 'patch'
        run: |
          yarn lerna publish patch --conventional-graduate $(echo "${{ env.PUBLISH }}")

      - name: Publish first patch RC (ie. v1.0.x-rc.0)
        if: |
          github.event.inputs.type == 'first rc' &&
          github.event.inputs.semver-type == 'patch'
        run: |
          yarn lerna publish prepatch --conventional-prerelease --preid rc --pre-dist-tag next $(echo "${{ env.PUBLISH }}")

      - name: Publish subsequent RC (ie. v1.0.0-rc.x)
        if: |
          github.event.inputs.type == 'subsequent rc'
        run: |
          yarn lerna publish --conventional-prerelease --preid rc --pre-dist-tag next $(echo "${{ env.PUBLISH }}")

      # After successfully publishing a release candidate, trigger the staging storybook environment deployment workflow.
      # Pass in the release branch name to the storybook deployment job so it build off the release branch
      - name: Dispatch staging storybook deployment workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: deploy-staging-storybook
          client-payload: '{"branch": "${{ github.ref_name }}"}'

      # After successfully publishing a full release, trigger the production storybook environment deployment workflow.
      # Pass in the release branch name to the storybook deployment job so it build off the release branch
      - name: Dispatch production storybook deployment workflow
        if: github.event.inputs.type  == 'full release'
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: deploy-latest-storybook
          client-payload: '{"branch": "${{ github.ref_name }}"}'
